<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1C1C1C">
  <title>Wind of Sand® — Albero Genealogico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --black: #1C1C1C;
      --dark: #2A2A2A;
      --charcoal: #3D3D3D;
      --gold: #B8872A;
      --gold-light: #D4A84A;
      --gold-pale: #F7EDD4;
      --white: #FFFFFF;
      --cream: #F4EFE6;
      --cream2: #EDE6DA;
      --stone: #DDD6C8;

      --stripe-m: #3B7EC8;
      --stripe-f: #C83B7E;
      --card-bg: #FFFFFF;
      --ext-bg: #EAE6DF;
      --card-shadow: 0 1px 5px rgba(0, 0, 0, 0.11);

      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.10);
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.13);
      --shadow-lg: 0 6px 28px rgba(0, 0, 0, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--black);
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }

    /* ── HEADER ── */
    #header {
      background: var(--black);
      color: var(--white);
      min-height: 60px;
      padding: 0 24px;
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      flex-shrink: 0;
      min-width: 0;
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }

    .brand-name em {
      font-style: italic;
      color: var(--gold-light);
    }

    .brand-social {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-social a {
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
      font-weight: 400;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .brand-social a:hover {
      color: var(--gold-light);
    }

    .brand-social .social-icon {
      flex-shrink: 0;
    }

    .header-divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .view-btn {
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: all 0.2s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .view-btn:hover {
      color: var(--white);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
    }

    .view-btn.active {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
      font-weight: 600;
    }

    /* Search */
    #search-wrapper {
      position: relative;
      margin-left: auto;
      flex-shrink: 0;
    }

    #search-box {
      width: 230px;
      padding: 7px 14px 7px 34px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 3px;
      color: var(--white);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.25s;
    }

    #search-box::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    #search-box:focus {
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--gold);
      width: 270px;
    }

    #search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 360px;
      background: var(--white);
      border: 1px solid var(--stone);
      border-radius: 4px;
      box-shadow: var(--shadow-lg);
      max-height: 400px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }

    #search-results::-webkit-scrollbar {
      width: 4px;
    }

    #search-results::-webkit-scrollbar-track {
      background: transparent;
    }

    #search-results::-webkit-scrollbar-thumb {
      background: var(--stone);
    }

    .result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--cream2);
      transition: background 0.12s;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover,
    .result-item:active {
      background: var(--gold-pale);
    }

    .result-item .r-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--black);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .result-item.ws .r-name {
      color: #8E6418;
    }

    .result-item .r-aka {
      font-size: 11px;
      font-style: italic;
      font-weight: 400;
      color: #6B5B3E;
      background: var(--gold-pale);
      padding: 1px 6px;
      border-radius: 2px;
    }

    .result-item .r-meta {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
      letter-spacing: 0.3px;
    }

    .result-empty {
      padding: 18px 16px;
      text-align: center;
      font-size: 12px;
      color: #888;
      font-style: italic;
    }

    .sex-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sex-dot.m {
      background: var(--stripe-m);
    }

    .sex-dot.f {
      background: var(--stripe-f);
    }

    .sex-dot.x {
      background: #B0ABA2;
    }

    /* ── CANVAS ── */
    #tree-container {
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #F4EFE6;
    }

    #tree-container svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ── SVG elements ── */
    .link {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      opacity: 0.35;
    }

    /* Dog cards */
    .dog-card {
      rx: 4;
      ry: 4;
      stroke-width: 1;
      transition: filter 0.12s;
    }

    .node-group {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .node-group:hover .dog-card {
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.20));
    }

    /* Unified card style */
    .dog-card.ws-m,
    .dog-card.ws-f {
      fill: var(--card-bg);
      stroke: none;
      filter: drop-shadow(var(--card-shadow));
    }

    .dog-card.ext {
      fill: var(--ext-bg);
      stroke: none;
      opacity: 0.78;
      filter: drop-shadow(var(--card-shadow));
    }

    .node-group:hover .dog-card.ext {
      opacity: 0.94;
    }

    .dog-card.root {
      stroke: var(--gold) !important;
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 6px rgba(184, 135, 42, 0.45)) !important;
    }

    .dog-name {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      fill: var(--black);
    }

    .dog-name.dim {
      fill: #9A948C;
      font-weight: 400;
    }

    .dog-date {
      font-family: 'Inter', sans-serif;
      fill: #8E887E;
    }

    .dog-date.dim {
      fill: #B8B2AA;
    }

    /* Sex symbol */
    .sex-sym {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      dominant-baseline: auto;
    }

    .sex-sym.m {
      fill: var(--stripe-m);
    }

    .sex-sym.f {
      fill: var(--stripe-f);
    }

    .sex-sym.x {
      fill: #B0ABA2;
    }

    .badge-circle {
      fill: var(--gold);
    }

    .badge-text {
      fill: #FFFFFF;
      font-size: 7.5px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Litter boxes */
    .litter-box {
      fill: rgba(255, 252, 246, 0.94);
      stroke: none;
      rx: 8;
      ry: 8;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.07));
    }

    .litter-hdr-date {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      fill: var(--gold);
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .litter-hdr-count {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      fill: #777;
    }

    .litter-hdr-parents {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11.5px;
      fill: #555;
      font-style: italic;
    }

    .gen-link {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      opacity: 0.4;
      stroke-dasharray: 4 4;
    }

    /* ── FLOATING PANELS ── */
    #info-bar {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--stone);
      border-radius: 6px;
      padding: 11px 18px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 60;
      max-width: calc(100vw - 120px);
      box-shadow: var(--shadow-lg);
    }

    .info-main {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      min-width: 0;
    }

    .info-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
      white-space: nowrap;
    }

    .info-aka {
      font-size: 11px;
      font-style: italic;
      color: #7D5B1C;
      background: var(--gold-pale);
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .info-sep {
      width: 1px;
      height: 16px;
      background: var(--stone);
      flex-shrink: 0;
    }

    .info-detail {
      font-size: 11px;
      color: #777;
      white-space: nowrap;
    }

    .info-parent-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 2px 5px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .info-parent-btn:hover {
      background: var(--cream);
      border-color: var(--stone);
      color: var(--black);
    }

    .info-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .info-badge {
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 5px 11px;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: background 0.15s;
    }

    .info-badge:hover {
      background: var(--gold-light);
    }

    .info-badge.secondary {
      background: var(--cream2);
      color: var(--charcoal);
    }

    .info-badge.secondary:hover {
      background: var(--stone);
    }

    .info-close {
      display: none;
      background: transparent;
      border: none;
      color: #888;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .info-close:hover {
      background: var(--cream2);
      color: var(--black);
    }

    /* Year jump bar (Overview) */
    #year-bar {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--stone);
      border-radius: 999px;
      padding: 4px 6px;
      max-width: calc(100vw - 120px);
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    #year-bar::-webkit-scrollbar {
      display: none;
    }

    .year-pill {
      border: none;
      background: transparent;
      color: #6E685F;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .year-pill:hover {
      background: var(--gold-pale);
      color: var(--black);
    }

    .year-pill.active {
      background: var(--gold);
      color: var(--black);
      font-weight: 600;
    }

    /* Legend + stats */
    #legend {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--stone);
      border-radius: 4px;
      padding: 12px 16px;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    #legend h4 {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #999;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .leg-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      color: #555;
      margin-bottom: 5px;
    }

    .leg-row:last-child {
      margin-bottom: 0;
    }

    .leg-card {
      width: 24px;
      height: 15px;
      border-radius: 2px;
      background: var(--card-bg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.13);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .leg-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--leg-stripe, transparent);
    }

    .leg-card.ext {
      background: var(--ext-bg);
      opacity: 0.78;
    }

    #stats {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--stone);
      border-radius: 4px;
      padding: 12px 16px;
      z-index: 50;
      font-size: 10px;
      color: #777;
      text-align: right;
      line-height: 1.8;
      box-shadow: var(--shadow-sm);
    }

    #stats strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* Combined top bar for tree view */
    #tree-toolbar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--stone);
      border-radius: 999px;
      padding: 6px 16px;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      max-width: calc(100vw - 28px);
    }

    #view-chip {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    .toolbar-sep {
      width: 1px;
      height: 14px;
      background: var(--stone);
    }

    #ancestors-toggle {
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #666;
      font-weight: 500;
    }

    #ancestors-toggle label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    #ancestors-toggle input[type="checkbox"] {
      accent-color: var(--gold);
      cursor: pointer;
    }

    /* Zoom */
    #zoom-ctrl {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom));
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 55;
      transition: bottom 0.2s ease;
    }

    #zoom-ctrl button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--stone);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--charcoal);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #zoom-ctrl button:hover {
      background: var(--gold-pale);
      border-color: var(--gold);
      color: var(--gold);
    }

    #zoom-ctrl button:active {
      transform: scale(0.95);
    }

    #btn-info-mobile {
      display: none;
    }

    /* Mobile info popover (legend + stats) */
    #mobile-info-sheet {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      left: 12px;
      max-width: 320px;
      margin-left: auto;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--stone);
      border-radius: 8px;
      padding: 14px 16px;
      z-index: 90;
      box-shadow: var(--shadow-lg);
    }

    #mobile-info-sheet.open {
      display: block;
    }

    .sheet-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sheet-hdr h4 {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--gold);
      font-weight: 600;
    }

    .sheet-close {
      background: transparent;
      border: none;
      color: #888;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .sheet-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    #mobile-stats-body {
      font-size: 11px;
      color: #666;
      text-align: right;
      line-height: 1.8;
    }

    #mobile-stats-body strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* Loading */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--stone);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading p {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
    }

    /* Hidden by default; mobile reveals */
    #search-toggle {
      display: none;
    }

    #mobile-search-overlay {
      display: none;
    }

    /* ── TABLET (641px–1024px) ── */
    @media (max-width: 1024px) {
      #header {
        padding: 0 16px;
        gap: 12px;
      }

      .brand-name {
        font-size: 19px;
        letter-spacing: 2px;
      }

      .brand-social .social-text {
        display: none;
      }

      .brand-social {
        gap: 8px;
      }

  <script>
    /* ── Constants ── */
    const CW = 160, CH = 48, HGAP = 28, VGAP = 10;

    /* ── State ── */
    let data, litters = [], founders = [], kennelIds = new Set(), currentView = 'overview', currentDog = null;
    let showExtAncestors = false;
    let overviewYearBounds = {};
    let overviewYears = [];
    let svg, g, zoom;

    /* ── Hash-based routing ── */
    function readHash() {
      const h = window.location.hash.slice(1);   // strip leading #
      if (!h || h === 'overview') return { view: 'overview', dogId: null };
      const slash = h.indexOf('/');
      if (slash === -1) return { view: h, dogId: null };
      return { view: h.slice(0, slash), dogId: h.slice(slash + 1) };
    }

    function navigate(view, dogId, replace = false) {
      const hash = view === 'overview' ? '#overview' : `#${view}/${dogId}`;
      if (replace) {
        history.replaceState({ view, dogId: dogId || null }, '', hash);
      } else {
        history.pushState({ view, dogId: dogId || null }, '', hash);
      }
      applyState(view, dogId);
    }

    function setInfoBarVisible(visible) {
      const bar = document.getElementById('info-bar');
      bar.style.display = visible ? 'flex' : 'none';
      document.body.classList.toggle('has-info-bar', visible);
    }

    function applyState(view, dogId) {
      currentView = view;
      currentDog = dogId || null;
      document.querySelectorAll('.view-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.view === currentView));
      if (currentView === 'overview') {
        renderOverview();
        setInfoBarVisible(false);
      } else {
        if (currentDog) _renderInfoBar(currentDog);
        renderTree();
      }
    }

    window.addEventListener('popstate', e => {
      const state = e.state || readHash();
      applyState(state.view || 'overview', state.dogId || null);
    });

    document.getElementById('ext-ancestors-cb').addEventListener('change', e => {
      showExtAncestors = e.target.checked;
      renderTree();
    });

    /* ── Helpers ── */
    const isWS = n => (n || '').toUpperCase().includes('WINDOFSAND');
    const isMale = s => s === 'M';
    const fmt = d => { if (!d) return ''; const p = d.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d; };
    const short = (n, max) => {
      if (!n) return '';
      const s = n.replace(/WINDOFSAND/gi, 'WS');
      return s.length > max ? s.slice(0, max - 1) + '…' : s;
    };
    const dn = n => (n || '').replace(/WINDOFSAND/gi, 'WS');
    const norm = s => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’'`]/g, '');
    const wrap2 = (text, max) => {
      const words = text.split(/\s+/); const lines = []; let line = '';
      for (const w of words) {
        const t = line ? line + ' ' + w : w;
        if (t.length > max && line) { lines.push(line); line = w; } else line = t;
      }
      if (line) lines.push(line);
      return lines.slice(0, 2);
    };
    const sexClass = s => s === 'M' ? 'm' : s === 'F' ? 'f' : 'x';

    /* ── Is external dog a direct parent of any WS dog? ── */
    function isWSParent(dog) {
      if (!data) return false;
      return (data.children[dog.id] || []).some(cid => isWS(data.dogs[cid]?.name));
    }

    /* ── Is external dog a grandparent of any WS dog? ── */
    function isWSGrandparent(dog) {
      if (!data) return false;
      return (data.children[dog.id] || []).some(cid => isWSParent(data.dogs[cid]));
    }

    /* ── Card class ── */
    function cardClass(dog, isRoot) {
      let c;
      if (isWS(dog.name) || kennelIds.has(dog.id)) {
        c = isMale(dog.sex) ? 'ws-m' : 'ws-f';
      } else {
        c = 'ext';
      }
      if (isRoot) c += ' root';
      return c;
    }

    /* ── Draw a dog card ── */
    let _cardClipSeq = 0;
    function drawCard(parent, dog, x, y, w, h, opts = {}) {
      if (!dog) return;
      const ws = isWS(dog.name) || kennelIds.has(dog.id);
      const stripeColor = !ws ? null : (dog.sex === 'M' ? '#3B7EC8' : dog.sex === 'F' ? '#C83B7E' : null);
      const grp = parent.append('g')
        .attr('class', 'node-group')
        .attr('transform', `translate(${x},${y})`)
        .on('click', e => { e.stopPropagation(); onDogClick(dog.id); });

      grp.append('rect')
        .attr('class', 'dog-card ' + cardClass(dog, opts.root))
        .attr('width', w).attr('height', h);

      /* left colour stripe for WINDOFSAND dogs */
      if (stripeColor) {
        grp.append('rect')
          .attr('x', 0).attr('y', 0).attr('width', 5).attr('height', h)
          .attr('rx', 4).attr('fill', stripeColor);
        /* white cover to square off the right edge of the stripe */
        grp.append('rect')
          .attr('x', 3).attr('y', 0).attr('width', 4).attr('height', h)
          .attr('fill', '#FFFFFF');
      }

      /* clip text area so names never collide with sex symbol */
      const clipId = `cc${++_cardClipSeq}`;
      grp.append('clipPath').attr('id', clipId)
        .append('rect').attr('x', 9).attr('y', 0).attr('width', w - 28).attr('height', h);

      /* sex symbol top-right */
      const sym = dog.is_cat ? '🐈‍⬛' : (dog.sex === 'M' ? '♂' : dog.sex === 'F' ? '♀' : '');
      const symColor = stripeColor || '#888';
      if (sym) grp.append('text')
        .attr('class', 'sex-sym ' + sexClass(dog.sex))
        .attr('x', w - 10).attr('y', 14)
        .attr('text-anchor', 'middle')
        .attr('fill', dog.is_cat ? null : symColor)
        .text(sym);

      /* name + aka + optional info (non-overlapping vertical rhythm) */
      const maxPerLine = opts.maxChars || 22;
      const rawName = short(dog.name, maxPerLine * 2);
      const lines = wrap2(rawName, maxPerLine);
      const aka = dog.aka;
      const hasAka = !!aka;
      const info = !opts.noInfo
        ? [fmt(dog.birth_date), dog.loi && !opts.hideLoi ? dog.loi : ''].filter(Boolean).join(' · ')
        : '';
      const hasInfo = !!info;

      let ny, lineStep = 11, akaY;
      if (hasInfo) {
        if (lines.length > 1) {
          ny = hasAka ? 12 : 15;
          lineStep = hasAka ? 10.5 : 11.5;
          akaY = ny + lineStep + 10.5;
        } else {
          ny = hasAka ? 16 : 21;
          akaY = ny + 11.5;
        }
      } else {
        if (lines.length > 1) {
          ny = hasAka ? 11.5 : (h / 2 - 3);
          lineStep = hasAka ? 10.5 : 11.5;
          akaY = ny + lineStep + 10.5;
        } else {
          ny = hasAka ? (h / 2 - 2.5) : (h / 2 + 3.5);
          akaY = ny + 11.5;
        }
      }

      const textLayer = grp.append('g').attr('clip-path', `url(#${clipId})`);
      lines.forEach((l, i) => {
        textLayer.append('text').attr('class', 'dog-name')
          .attr('font-size', '9.8px')
          .attr('x', 10).attr('y', ny + i * lineStep)
          .text(i === 1 && l.length > maxPerLine ? l.slice(0, maxPerLine - 1) + '…' : l);
      });

      if (hasAka) {
        textLayer.append('text')
          .attr('x', 10).attr('y', akaY)
          .attr('font-size', '8.5px')
          .attr('font-style', 'italic')
          .attr('fill', '#8B7344')
          .text(aka);
      }

      if (hasInfo) {
        textLayer.append('text').attr('class', 'dog-date')
          .attr('font-size', '8px')
          .attr('x', 10).attr('y', h - 5.5)
          .text(info);
      }

      /* offspring badge */
      const kids = (data.children[dog.id] || []).length;
      if (kids > 0 && !opts.noBadge) {
        grp.append('circle').attr('class', 'badge-circle').attr('cx', w - 1).attr('cy', 1).attr('r', 8.5);
        grp.append('text').attr('class', 'badge-text').attr('x', w - 1).attr('y', 1).text(kids);
      }
    }

    /* ── Litter computation ── */
    function computeLitters() {
      const EXCLUDE_AS_PUPPY = new Set();
      for (const [id, dog] of Object.entries(data.dogs)) {
        if (dog.role || dog.hide_birth_litter) EXCLUDE_AS_PUPPY.add(id);
      }
      const map = {};
      for (const [id, rels] of Object.entries(data.relationships)) {
        if (EXCLUDE_AS_PUPPY.has(id)) continue;
        const dog = data.dogs[id];
        if (!dog) continue;
        const sireDoc = data.dogs[rels.sire];
        const damDoc  = data.dogs[rels.dam];
        const inLineage = d => d && (isWS(d.name) || isWSParent(d) || isWSGrandparent(d));
        const inKennel = isWS(dog.name) || (inLineage(sireDoc) && inLineage(damDoc));
        if (!inKennel) continue;
        const key = `${rels.sire || '?'}_${rels.dam || '?'}_${dog.birth_date || '?'}`;
        if (!map[key]) map[key] = { key, sireId: rels.sire || null, damId: rels.dam || null, birthDate: dog.birth_date || null, puppies: [] };
        map[key].puppies.push(id);
      }
      return Object.values(map)
        .filter(l => l.puppies.length > 0 && l.birthDate)
        .sort((a, b) => a.birthDate.localeCompare(b.birthDate))
        .map(l => {
          l.puppies.sort((a, b) => {
            const ma = data.dogs[a]?.sex === 'M' ? 0 : 1, mb = data.dogs[b]?.sex === 'M' ? 0 : 1;
            return ma !== mb ? ma - mb : (data.dogs[a]?.name || '').localeCompare(data.dogs[b]?.name || '');
          });
          return l;
        });
    }

    /* ── Founder computation ── */
    function computeFounders() {
      const inLitter = new Set();
      litters.forEach(l => l.puppies.forEach(id => inLitter.add(id)));
      const seen = new Set();
      const result = [];
      for (const [id, dog] of Object.entries(data.dogs)) {
        if (dog.role && dog.birth_date) {
          seen.add(id);
          const roleLabels = {
            new_entry: 'NEW ENTRY',
            dove_tutto_iniziato: 'DOVE TUTTO È INIZIATO...',
            capostipite: 'CAPOSTIPITE',
            in_casa_ws: 'IN CASA WS...',
            famiglia_allargata: 'LA FAMIGLIA ALLARGATA',
            mascotte: 'LA MASCOTTE WS'
          };
          result.push({ dog, label: roleLabels[dog.role] || 'CAPOSTIPITE' });
        }
      }
      litters.forEach(l => {
        [l.sireId, l.damId].forEach(id => {
          if (!id || seen.has(id) || inLitter.has(id)) return;
          const dog = data.dogs[id];
          if (!dog || !dog.birth_date || dog.hide_birth_litter) return;
          seen.add(id);
          result.push({ dog, label: 'CAPOSTIPITE' });
        });
      });
      return result.sort((a, b) => a.dog.birth_date.localeCompare(b.dog.birth_date));
    }

    /* ── Year bar helper ── */
    function renderYearBar(years) {
      const bar = document.getElementById('year-bar');
      bar.innerHTML = years.map(yr =>
        `<button class="year-pill" data-year="${yr}">${yr}</button>`
      ).join('');
      bar.style.display = 'flex';
      bar.querySelectorAll('.year-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          focusYear(btn.dataset.year);
        });
      });

    function setActiveYearPill(yr) {
      const bar = document.getElementById('year-bar');
      bar.querySelectorAll('.year-pill').forEach(b => {
        const active = b.dataset.year === yr;
        b.classList.toggle('active', active);
        if (active) b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    }

    function focusYear(yr, animate = true) {
      const b = overviewYearBounds[yr];
      if (!b) return;
      const ctr = document.getElementById('tree-container');
      const W = ctr.clientWidth, H = ctr.clientHeight;
      const mobile = W <= 640;
      const padX = mobile ? 18 : 60;
      const padTop = mobile ? 20 : 40;
      const padBot = mobile ? 72 : 76;
      const colW = b.maxX - b.minX;
      const colH = b.maxY - b.minY;
      const scX = (W - padX * 2) / colW;
      const scY = (H - padTop - padBot) / colH;
      const sc = mobile
        ? Math.min(Math.max(scX * 0.92, 0.72), 1.35)
        : Math.min(scX, scY, 1.25);
      const cx = (b.minX + b.maxX) / 2;
      const tx = W / 2 - cx * sc;
      const ty = mobile ? (padTop - b.minY * sc) : (padTop + (H - padTop - padBot) / 2 - (b.minY + colH / 2) * sc);
      const t = d3.zoomIdentity.translate(tx, ty).scale(sc);
      if (animate) {
        svg.transition().duration(420).ease(d3.easeCubicOut).call(zoom.transform, t);
      } else {
        svg.call(zoom.transform, t);
      }
      setActiveYearPill(yr);
    }

    /* ── OVERVIEW ── */
    function renderOverview() {
      g.selectAll('*').remove();
      setInfoBarVisible(false);
      document.getElementById('tree-toolbar').style.display = 'none';

      const PW = 168, PH = 38, PG = 4, LP = 10, LH = 56, HCOL = 48, VCOL = 24;
      const FW = 204, FH = 52;
      const FOUNDER_LABEL_H = 16;

      const byYear = {};
      founders.forEach(({ dog, label }) => {
        const yr = dog.birth_date ? dog.birth_date.slice(0, 4) : '?';
        (byYear[yr] || (byYear[yr] = [])).push({ type: 'founder', dog, label });
      });
      litters.forEach(l => {
        const yr = l.birthDate ? l.birthDate.slice(0, 4) : '?';
        (byYear[yr] || (byYear[yr] = [])).push({ type: 'litter', litter: l });
      });
      const years = Object.keys(byYear).sort();
      overviewYears = years;

      let colX = 0;
      const allPos = [];

      years.forEach(yr => {
        const grp = byYear[yr];
        let ry = HCOL;
        let maxW = 0;
        grp.forEach(item => {
          const iw = item.type === 'founder' ? FW + LP * 2 : PW + LP * 2;
          const ih = item.type === 'founder'
            ? FOUNDER_LABEL_H + FH
            : LH + item.litter.puppies.length * (PH + PG) + LP;
          allPos.push({ item, x: colX, y: ry, w: iw, h: ih, yr });
          maxW = Math.max(maxW, iw);
          ry += ih + VCOL;
        });
        colX += maxW + HCOL;
      });

      const yranges = {};
      overviewYearBounds = {};
      allPos.forEach(ap => {

        r.min = Math.min(r.min, ap.x); r.max = Math.max(r.max, ap.x + ap.w);

        const b = overviewYearBounds[ap.yr] || (overviewYearBounds[ap.yr] = {
          minX: ap.x, maxX: ap.x + ap.w, minY: 0, maxY: ap.y + ap.h
        });
        b.minX = Math.min(b.minX, ap.x);
        b.maxX = Math.max(b.maxX, ap.x + ap.w);
        b.maxY = Math.max(b.maxY, ap.y + ap.h);
      });

      const totalH = allPos.length ? Math.max(...allPos.map(ap => ap.y + ap.h)) : 400;

      years.forEach((yr, idx) => {
        const r = yranges[yr];
        g.append('text')
          .attr('x', (r.min + r.max) / 2).attr('y', 28)

          .attr('font-size', '22px').attr('font-weight', '300')

          .attr('fill', '#C09A3A')
          .text(yr);
        if (idx > 0) {
          g.append('line')
            .attr('x1', r.min - HCOL / 2).attr('y1', 0)
            .attr('x2', r.min - HCOL / 2).attr('y2', totalH + 40)
            .attr('stroke', '#C09A3A').attr('stroke-width', 0.5).attr('opacity', 0.13);
        }
      });

      const pupPos = {};
      let _lci = 0;

      allPos.forEach(({ item, x, y, w, h }) => {
        if (item.type === 'founder') {
          const { dog, label } = item;
          g.append('text')
            .attr('x', x + w / 2).attr('y', y + 9)
            .attr('text-anchor', 'middle')
            .attr('font-size', '7px').attr('letter-spacing', '1.8px')
            .attr('fill', '#C09A3A').attr('opacity', 0.8)

            .text(label);
          const cx = x + LP, cy = y + FOUNDER_LABEL_H;
          drawCard(g, dog, cx, cy, FW, FH, { noInfo: true, maxChars: 26, noBadge: true });
          pupPos[dog.id] = { cx: cx + FW / 2, cy: cy + FH / 2, right: cx + FW, left: cx };
        } else {
          _lci++;
          const { litter } = item;

          const dam = litter.damId ? data.dogs[litter.damId] : null;

          const females = litter.puppies.length - males;

          g.append('rect').attr('class', 'litter-box').attr('x', x).attr('y', y).attr('width', w).attr('height', h);
          g.append('rect').attr('x', x).attr('y', y).attr('width', w).attr('height', 3)
            .attr('rx', 3).attr('fill', '#B8872A');

          const clipId = `lc${_lci}`;
          g.append('clipPath').attr('id', clipId)
            .append('rect').attr('x', x + LP).attr('y', y).attr('width', w - LP * 2).attr('height', LH + 2);

          g.append('text').attr('class', 'litter-hdr-date')

          g.append('text').attr('class', 'litter-hdr-count')
            .attr('x', x + w - LP).attr('y', y + 14)
            .attr('text-anchor', 'end')
            .attr('clip-path', `url(#${clipId})`)

          if (sire) {
            const st = g.append('text').attr('class', 'litter-hdr-parents')
              .attr('x', x + LP).attr('y', y + 30)
              .attr('clip-path', `url(#${clipId})`);

          const src = pupPos[pid]; if (!src) return;
          const tx = x, ty = y + LH / 2;

          const cp = Math.max(dx * 0.45, 28);
          linkLayer.append('path').attr('class', 'gen-link')
            .attr('d', `M${src.right},${src.cy} C${src.right + cp},${src.cy} ${tx - cp},${ty} ${tx},${ty}`);

            .attr('cx', src.right).attr('cy', src.cy).attr('r', 2.5)

    /* ── PEDIGREE / DISCENDENTI ── */
    function buildPedigreeTree(id, depth, isRoot = false) {
      const dog = data.dogs[id]; if (!dog) return null;
      if (!isRoot && !showExtAncestors && !isWS(dog.name) && !kennelIds.has(dog.id)) return null;
      const node = { id, dog, children: [] };
      if (depth <= 0) return node;
      const r = data.relationships[id];
      if (r) {
        if (r.sire && data.dogs[r.sire]) { const n = buildPedigreeTree(r.sire, depth - 1); if (n) node.children.push(n); }
        if (r.dam  && data.dogs[r.dam])  { const n = buildPedigreeTree(r.dam,  depth - 1); if (n) node.children.push(n); }
      }
      return node;
    }

    function buildDescTree(id, depth, seen = new Set()) {
      const dog = data.dogs[id]; if (!dog || seen.has(id)) return null;
      seen.add(id);
      const node = { id, dog, children: [] };
      if (depth <= 0) return node;
      (data.children[id] || []).forEach(kid => {
        if (data.dogs[kid] && !seen.has(kid)) {
          const c = buildDescTree(kid, depth - 1, seen);
          if (c) node.children.push(c);
        }
      });
      node.children.sort((a, b) => (a.dog.birth_date || '9999').localeCompare(b.dog.birth_date || '9999'));
      return node;
    }

    function renderTree() {
      g.selectAll('*').remove();
      document.getElementById('year-bar').style.display = 'none';

      const isDesc = currentView === 'descendants';
      const toolbar = document.getElementById('tree-toolbar');
      const chip = document.getElementById('view-chip');
      const sep = document.getElementById('toolbar-sep');
      const toggle = document.getElementById('ancestors-toggle');

      toolbar.style.display = 'flex';
      chip.textContent = isDesc ? 'Discendenti' : 'Antenati';
      sep.style.display = isDesc ? 'none' : 'block';
      toggle.style.display = isDesc ? 'none' : 'block';

      const root = isDesc ? buildDescTree(currentDog, 3) : buildPedigreeTree(currentDog, 4, true);
      if (!root) return;

      const hier = d3.hierarchy(root, d => d.children);
      const n = hier.descendants().length;
      const vg = n > 40 ? 6 : n > 20 ? 8 : VGAP;

      d3.tree().nodeSize([CH + vg, CW + HGAP])
        .separation((a, b) => a.parent === b.parent ? 1 : 1.1)(hier);

      const lk = d3.linkHorizontal().x(d => d[0]).y(d => d[1]);

      g.selectAll('.link').data(hier.links()).join('path').attr('class', 'link')
        .attr('d', d => {
          const sx = d.source.y + CW / 2, sy = d.source.x;
          const tx = d.target.y - CW / 2, ty = d.target.x;
          return lk({ source: [sx, sy], target: [tx, ty] });
        });

      hier.descendants().forEach(d => {
        drawCard(g, d.data.dog, d.y - CW / 2, d.x - CH / 2, CW, CH,
          { root: d.data.id === currentDog, maxChars: 22 });
      });

      scheduleFit();
    }

    /* ── Fit to screen ── */
    function fitScreen(initialOverview = false) {
      const bb = g.node().getBBox(); if (!bb.width) return;
      const ctr = document.getElementById('tree-container');
      const W = ctr.clientWidth, H = ctr.clientHeight;
      const mobile = W <= 640;

      /* On mobile initial overview load, focus on the latest year at a readable scale */
      if (mobile && initialOverview && currentView === 'overview' && overviewYears.length) {
        focusYear(overviewYears[overviewYears.length - 1], false);
        return;
      }

      const padX = mobile ? 14 : 70;
      const padTop = mobile ? 54 : 70;
      const padBot = mobile ? (document.body.classList.contains('has-info-bar') ? 135 : 70) : 80;
      const maxSc = mobile ? 1.15 : 1.5;
      const sc = Math.min((W - padX * 2) / bb.width, (H - padTop - padBot) / bb.height, maxSc);
      const tx = W / 2 - (bb.x + bb.width / 2) * sc;
      const ty = padTop + (H - padTop - padBot) / 2 - (bb.y + bb.height / 2) * sc;
      svg.transition().duration(400).ease(d3.easeCubicOut)
        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));

      if (currentView === 'overview') {
        document.querySelectorAll('.year-pill').forEach(b => b.classList.remove('active'));
      }
    }

    function scheduleFit(initialOverview = false) {
      const delay = window.innerWidth <= 640 ? 180 : 60;
      setTimeout(() => fitScreen(initialOverview), delay);
    }

      data = await res.json();
      if (!data.children) data.children = {};

      litters = computeLitters();
      founders = computeFounders();
      kennelIds = new Set(data.windofsand_ids || []);

      founders.forEach(({ dog }) => kennelIds.add(dog.id));

      const wsN = data.windofsand_ids?.length || 0;
      const totN = Object.keys(data.dogs).length;
      const statsHtml =
        `<strong>${wsN}</strong> WINDOFSAND<br>` +
        `<strong>${litters.length}</strong> cucciolate 🐾<br>` +

    /* ── Search (matches name, aka, and LOI; sorts before slicing) ── */
    function doSearch(rawQ, resultsEl) {
      const q = norm(rawQ);
      if (!q || q.length < 2 || !data) { resultsEl.style.display = 'none'; return; }
      const hits = [];
      for (const [id, dog] of Object.entries(data.dogs)) {
        const nName = norm(dog.name);
        const nAka = norm(dog.aka);
        const nLoi = norm(dog.loi);
        if (nName.includes(q) || nAka.includes(q) || nLoi.includes(q)) {
          const akaExact = nAka && (nAka === q || nAka.startsWith(q)) ? 0 : 1;
          hits.push({ id, dog, akaExact });
        }
      }
      hits.sort((a, b) => {
        if (a.akaExact !== b.akaExact) return a.akaExact - b.akaExact;
        const aw = (isWS(a.dog.name) || kennelIds.has(a.id)) ? 0 : 1;
        const bw = (isWS(b.dog.name) || kennelIds.has(b.id)) ? 0 : 1;
        return aw !== bw ? aw - bw : (a.dog.name || '').localeCompare(b.dog.name || '');
      });
      const top = hits.slice(0, 25);
      if (!top.length) {
        resultsEl.innerHTML = `<div class="result-empty">Nessun risultato per “${rawQ.replace(/</g, '&lt;')}”</div>`;
        resultsEl.style.display = 'block';
        return;
      }
      resultsEl.innerHTML = top.map(({ id, dog }) => {
        const kids = (data.children[id] || []).length;
        const ws = (isWS(dog.name) || kennelIds.has(id)) ? ' ws' : '';
        const sc = sexClass(dog.sex);
        const sx = dog.sex === 'M' ? '♂' : dog.sex === 'F' ? '♀' : '';
        const akaTag = dog.aka ? `<span class="r-aka">${dog.aka}</span>` : '';
        return `<div class="result-item${ws}" data-id="${id}" role="option">
      <div class="r-name"><span class="sex-dot ${sc}"></span><span>${sx} ${dn(dog.name)}</span>${akaTag}</div>
      <div class="r-meta">${fmt(dog.birth_date) || ''}${dog.loi ? ' · ' + dog.loi : ''}${kids ? ' · ' + kids + ' cuccioli' : ''}</div>
    </div>`;
      }).join('');
      resultsEl.style.display = 'block';
    }

    const sb = document.getElementById('search-box');
    const sr = document.getElementById('search-results');

    sb.addEventListener('input', () => doSearch(sb.value.trim(), sr));

    sr.addEventListener('click', e => {
      const item = e.target.closest('.result-item'); if (!item) return;
      sb.value = ''; sr.style.display = 'none';
      onDogClick(item.dataset.id);
    });

    sb.addEventListener('keydown', e => {
      if (e.key === 'Escape') { sb.value = ''; sr.style.display = 'none'; sb.blur(); }
    });

    /* ── Mobile search ── */
    const searchToggle = document.getElementById('search-toggle');
    const mobileSearchOverlay = document.getElementById('mobile-search-overlay');
    const mobileSearchClose = document.getElementById('mobile-search-close');
    const msb = document.getElementById('mobile-search-box');
    const msr = document.getElementById('mobile-search-results');

    function closeMobileSearch() {
      mobileSearchOverlay.classList.remove('open');
      mobileSearchOverlay.setAttribute('aria-hidden', 'true');
      searchToggle.setAttribute('aria-expanded', 'false');
      msb.value = '';
      msr.style.display = 'none';
    }

    searchToggle.addEventListener('click', () => {
      const willOpen = !mobileSearchOverlay.classList.contains('open');
      if (willOpen) {
        infoSheet.classList.remove('open');
        mobileSearchOverlay.classList.add('open');
        mobileSearchOverlay.setAttribute('aria-hidden', 'false');
        searchToggle.setAttribute('aria-expanded', 'true');
        setTimeout(() => msb.focus(), 40);
      } else {
        closeMobileSearch();
      }
    });

    mobileSearchClose.addEventListener('click', closeMobileSearch);

    mobileSearchOverlay.addEventListener('click', e => {
      if (e.target === mobileSearchOverlay) closeMobileSearch();
    });

    msb.addEventListener('input', () => doSearch(msb.value.trim(), msr));

    msr.addEventListener('click', e => {
      const item = e.target.closest('.result-item'); if (!item) return;
      closeMobileSearch();
      onDogClick(item.dataset.id);
    });

    msb.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMobileSearch();
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#search-results') && !e.target.closest('#search-wrapper'))
        sr.style.display = 'none';
      if (infoSheet.classList.contains('open') && !e.target.closest('#mobile-info-sheet') && !e.target.closest('#btn-info-mobile'))
        infoSheet.classList.remove('open');
    });

    init();
  </script>
</body>

</html>
